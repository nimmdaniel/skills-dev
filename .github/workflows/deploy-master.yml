# Standalone-Prod Skills: Push auf master deployt live (nur CI) — aus dem MASTER-Checkout des eigenen Repos,
# OHNE das Meta-Repo vitalos (gleiches Muster wie fitness-dev/deploy-master.yml). Skills hat keine Nachbar-Repos
# und keine Submodule; Install mit eigenem Lockfile (standalone, ohne Workspace).
# Auslöser: push auf master und workflow_dispatch (automerge.yml) -> baut und deployt live (nur master).
# Push auf `ci-test/**` -> reiner Build-Test, KEIN Deploy.
# Release-Branch `vitalos` und die Submodul-Pfade im Meta-Repo bleiben unberührt.

name: Live Deploy (Skills master)

'on':
  workflow_dispatch:
    inputs:
      deploy:
        description: "Live deployen? (nur auf master wirksam; false = nur bauen)"
        type: boolean
        default: true
  push:
    branches:
      - master
      - 'ci-test/**'

concurrency:
  group: live-skills-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # nur für das Vorspulen des Branches vitalos (letzter Schritt)

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DO_DEPLOY: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.deploy) }}
    steps:
      - name: Checkout skills-dev
        uses: actions/checkout@v4
        with:
          path: skills-dev
          # Volle Historie: der Changelog liest bei workflow_dispatch `git log <parent>..HEAD`.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: skills-dev/pnpm-lock.yaml

      - name: Install Skills standalone dependencies
        working-directory: skills-dev
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Verify exercise videos
        working-directory: skills-dev
        run: node scripts/test-exercise-videos.mjs

      - name: Build Skills
        working-directory: skills-dev
        run: pnpm run build

      - name: Deploy Skills to Firebase Hosting
        if: env.DO_DEPLOY == 'true'
        working-directory: skills-dev
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/skills-sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/skills-sa.json" \
            npx firebase-tools@latest deploy --only hosting:skills \
            --project fitness-aos --non-interactive

      - name: Branch vitalos auf master vorspulen (Fast-Forward, Release-Branch der Shell)
        if: env.DO_DEPLOY == 'true' && success()
        continue-on-error: true
        working-directory: skills-dev
        run: |
          set -euo pipefail
          git fetch origin vitalos
          if git merge-base --is-ancestor origin/vitalos HEAD; then
            git push origin HEAD:refs/heads/vitalos
            echo "vitalos -> $(git rev-parse --short HEAD)"
          else
            echo "::warning::vitalos enthält Commits, die nicht in master sind — kein Fast-Forward, bitte manuell abgleichen"
          fi
